# https://pre-commit.com
# 安装：pip install pre-commit && pre-commit install
#   （本配置含 default_install_hook_types，会同时安装 pre-commit + commit-msg；旧环境可补：pre-commit install --hook-type commit-msg）
# 手动：pre-commit run --all-files（不含 commit-msg）
# 复杂度脚本需：pip install lizard
# 不含：Victauri 全量 E2E；含本仓 frontend wasm / clippy、ktlint-android（需 java）、Playwright e2e format/lint
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: check-no-main-path
        name: forbid path deps back to Server monorepo
        entry: bash scripts/check-no-main-path.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-fmt
        name: cargo fmt (desktop + mobile + client-api + connect + tui + web-host + frontend)
        entry: >-
          bash -c 'cd desktop-tauri/src-tauri && cargo fmt --all -- --check
          && cd ../../mobile-tauri/src-tauri && cargo fmt --all -- --check
          && cd ../../crates/crabmate-client-api && cargo fmt --all -- --check
          && cd ../crabmate-connect && cargo fmt --all -- --check
          && cd ../crabmate-tui-core && cargo fmt --all -- --check
          && cd ../crabmate-tui && cargo fmt --all -- --check
          && cd ../crabmate-web-host && cargo fmt --all -- --check
          && cd ../../frontend && cargo fmt --all -- --check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: tauri-dist-stubs
        name: desktop/mobile dist stubs for tauri codegen
        entry: bash scripts/ensure-tauri-dist-stubs.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: desktop-clippy
        name: desktop-tauri clippy (-D warnings)
        entry: bash -c 'cd desktop-tauri/src-tauri && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mobile-clippy
        name: mobile-tauri clippy (-D warnings)
        entry: bash -c 'cd mobile-tauri/src-tauri && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: client-api-clippy
        name: crabmate-client-api clippy (-D warnings)
        entry: bash -c 'cd crates/crabmate-client-api && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: connect-clippy
        name: crabmate-connect clippy (-D warnings)
        entry: bash -c 'cd crates/crabmate-connect && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: tui-core-clippy
        name: crabmate-tui-core clippy (-D warnings)
        entry: bash -c 'cd crates/crabmate-tui-core && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: tui-clippy
        name: crabmate-tui clippy (-D warnings)
        entry: bash -c 'cd crates/crabmate-tui && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: web-host-clippy
        name: crabmate-web-host clippy (-D warnings)
        entry: bash -c 'cd crates/crabmate-web-host && cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-wasm-check
        name: frontend wasm check
        entry: bash -c 'rustup target add wasm32-unknown-unknown 2>/dev/null || true; cd frontend && cargo check --target wasm32-unknown-unknown --all-targets'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-clippy
        name: frontend clippy wasm32 (-D warnings)
        entry: bash -c 'rustup target add wasm32-unknown-unknown 2>/dev/null || true; cd frontend && cargo clippy --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lizard-rust
        name: lizard complexity (Rust CCN>10 count)
        entry: bash scripts/lizard-rust.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: fn-param-ratchet
        name: fn param cap (lizard max params ≤ 9)
        entry: bash scripts/fn-param-ratchet.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: fn-nloc-ratchet
        name: fn nloc + rust file lines (nloc ≤ 200, file ≤ 920)
        entry: bash scripts/fn-nloc-ratchet.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: taplo-format
        name: taplo format (check)
        entry: >-
          bash -c 'if command -v taplo >/dev/null 2>&1; then taplo format --check .; else echo "taplo 未安装，跳过"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: taplo-lint
        name: taplo lint
        entry: >-
          bash -c 'if command -v taplo >/dev/null 2>&1; then taplo lint .; else echo "taplo 未安装，跳过"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ktlint-android
        name: ktlint Android (edu/crabmate)
        entry: bash scripts/ktlint-android.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: e2e-format
        name: e2e format (prettier)
        entry: bash -c 'cd e2e && npm run format:check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: e2e-lint
        name: e2e lint (tsc --noEmit)
        entry: bash -c 'cd e2e && npm run lint'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: v1.35.5
    hooks:
      - id: typos

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          # 与 .cursor/rules/conventional-commits.mdc 中的 type 对齐
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
