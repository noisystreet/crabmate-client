# https://embarkstudios.github.io/cargo-deny/
# 本地：bash scripts/dependency-security.sh（需 cargo-audit / cargo-deny）
# CI：.github/workflows/dependency-security.yml
# 不进 pre-commit（每次会拉 RustSec advisory DB）。

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8
# 与常见 Rust / Tauri 生态对齐；强 copyleft（GPL/AGPL）不在此列，若引入将报错。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "bzip2-1.0.6",
    "Unicode-3.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

# `ring` 的 Cargo 元数据不足以自动判定 SPDX 表达式。
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 业务 UI 钉 Server 契约 crates（见 frontend/Cargo.toml；禁止 path 回主仓）。
allow-git = ["https://github.com/noisystreet/CrabMate"]
