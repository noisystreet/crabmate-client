[package]
name = "crabmate-mobile"
version = "0.8.0-beta.1"
description = "CrabMate Android remote client (Tauri thin shell)"
authors = ["crabmate contributors"]
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crabmate-connect = { path = "../../crates/crabmate-connect", features = ["tauri"] }

# Android：reqwest 的 rustls 后端用 rustls-platform-verifier 校验系统证书库，
# 须经 JNI 注入 Context（见 src/android_tls.rs）；jni 版本与上游要求一致（0.22）。
# 固定 =0.7.1：0.7.1 起 Android 组件（AAR）不再随 crate 打包，改由上游 GitHub `maven-archive`
# 分支的远程 Maven 仓库分发（坐标 org.rustls，见 gen/android/app/build.gradle.kts），
# 因此**首次** Android 构建需要能访问 github（Gradle 下载 AAR），之后走 Gradle 缓存。
# 0.7.1 的安全内容：允许在 Android 上拉取 CRL 吊销数据（OCSP 逐步弃用后越来越多 CA 只发
# CRL），并修了「系统信任锚被系统用户禁用时的死循环」；另含 Windows 主机名尾部 `.` 的修复。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "=0.7.1"

[lib]
name = "crabmate_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crabmate-mobile"
path = "src/main.rs"

[workspace]
