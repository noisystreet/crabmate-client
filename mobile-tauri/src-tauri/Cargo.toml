[package]
name = "crabmate-mobile"
version = "0.5.1-alpha.0"
description = "CrabMate Android remote client (Tauri thin shell)"
authors = ["crabmate contributors"]
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crabmate-connect = { path = "../../crates/crabmate-connect", features = ["tauri"] }

[lib]
name = "crabmate_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crabmate-mobile"
path = "src/main.rs"

[workspace]
