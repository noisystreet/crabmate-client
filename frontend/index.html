<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CrabMate</title>
    <!-- 首绘前底色：避免桌面/移动 WebView 默认黑屏（与 tokens --bg 对齐） -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090e;
        color: #eef1f6;
      }
      #cm-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: radial-gradient(120% 80% at 50% 0%, #1c1f33 0%, #07090e 55%);
        font-family: "Segoe UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #cm-boot-splash .cm-boot-mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #8fa4ea;
        background: linear-gradient(145deg, #2a2b40, #161727);
        border: 1px solid #37384e;
        box-shadow: 0 8px 24px rgba(2, 4, 10, 0.45);
      }
      #cm-boot-splash .cm-boot-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      #cm-boot-splash .cm-boot-status {
        margin: 0;
        font-size: 0.9rem;
        color: #9099b4;
      }
      #cm-boot-splash .cm-boot-loader {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(143, 164, 234, 0.32);
        border-top-color: #8fa4ea;
        border-radius: 50%;
        animation: cm-boot-spin 0.75s linear infinite;
      }
      @keyframes cm-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #cm-boot-splash .cm-boot-loader {
          animation: none;
        }
      }
      /* 浅色主题首帧：data-theme 由下方预绘脚本在首绘前写入，浅色用户的启动页第一帧即浅色。
         上面那行深色 background 字面量保持不动（镜像门禁要求它恰好命中一次），覆层只引用
         token，不新增色值副本；-light 后缀与 app_prefs::theme_css_is_light 同口径。 */
      html[data-theme$='-light'],
      html[data-theme$='-light'] body {
        background: var(--bg);
        color: var(--text);
      }
      html[data-theme$='-light'] #cm-boot-splash {
        /* 浅色下不铺深色径向渐变（#1c1f33 无对应 token），直接平铺 --bg */
        background: var(--bg);
      }
      html[data-theme$='-light'] #cm-boot-splash .cm-boot-mark {
        color: var(--accent);
        background: var(--surface);
        border-color: var(--border);
      }
      html[data-theme$='-light'] #cm-boot-splash .cm-boot-status {
        color: var(--muted);
      }
      html[data-theme$='-light'] #cm-boot-splash .cm-boot-loader {
        border-color: var(--accent-dim);
        border-top-color: var(--accent);
      }
    </style>
    <!-- 预绘主题：偏好真源在 serve 的 /user-data/prefs（异步），首帧只能依据本机镜像
         （键与取值规则见 frontend/src/app/shell_prefs_storage.rs）。缺失 / 非法 / 存储不可用
         一律不写属性，由 :root 的深色基线兜底；system 在此按 OS 明暗解析，与
         resolve_data_theme_slug 在「桌面原生 OS 提示未知」时的分支等价（拿不到按浅色）。
         不抄主题白名单：非法值匹配不到任何 data-theme 规则，自然回落深色。 -->
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('crabmate.theme.pref');
          if (!raw) return;
          var pref = raw.trim();
          if (!/^[a-z0-9-]{1,32}$/.test(pref)) return;
          if (pref === 'system') {
            var prefersDark = false;
            try {
              prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (_) {
              prefersDark = false;
            }
            pref = prefersDark ? 'crabmate-dark' : 'crabmate-light';
          }
          document.documentElement.setAttribute('data-theme', pref);
        } catch (_) {
          /* 存储被禁 / localStorage 抛错：保留 :root 深色基线，不阻塞水合 */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Trunk 不会把 @import 打进单文件，也不会复制未声明的 CSS；须逐条声明，否则 dist 缺样式 -->
    <!-- components.css 中 brand-mark 背景图为 url("../brand-mark.svg")→打包后与 CSS 同目录上一级即站点根 /brand-mark.svg -->
    <link data-trunk rel="copy-file" href="brand-mark.svg" />
    <link data-trunk rel="css" href="styles/tokens.css" />
    <link data-trunk rel="css" href="themes/crabmate-light.css" />
    <link data-trunk rel="css" href="themes/material-dark.css" />
    <link data-trunk rel="css" href="themes/high-contrast-dark.css" />
    <link data-trunk rel="css" href="themes/shadcn-dark.css" />
    <link data-trunk rel="css" href="themes/shadcn-light.css" />
    <link data-trunk rel="css" href="styles/base.css" />
    <link data-trunk rel="css" href="styles/components.css" />
    <link data-trunk rel="css" href="styles/layout-chat.css" />
    <link data-trunk rel="css" href="styles/shell-topbar.css" />
    <link data-trunk rel="css" href="styles/ide-layout.css" />
    <link data-trunk rel="copy-file" href="vendor/ide-codemirror.js" data-target-path="vendor" />
    <link data-trunk rel="css" href="styles/ide-codemirror.css" />
    <link data-trunk rel="css" href="styles/shell-ds.css" />
    <link data-trunk rel="css" href="styles/tauri-shell.css" />
    <link data-trunk rel="css" href="styles/sidebar.css" />
    <link data-trunk rel="css" href="styles/status.css" />
    <link data-trunk rel="css" href="styles/modal.css" />
    <link data-trunk rel="css" href="styles/mobile.css" />
    <link data-trunk rel="css" href="styles/motion.css" />
  </head>
  <body>
    <div id="cm-boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="cm-boot-mark" aria-hidden="true">C</div>
      <p class="cm-boot-title">CrabMate</p>
      <div class="cm-boot-loader" aria-hidden="true"></div>
      <p class="cm-boot-status">正在加载界面…</p>
    </div>
    <!-- ide-codemirror.js：进 IDE 时由 ide_codemirror.rs 动态加载，避免阻塞对话首屏 -->
    <!--
      Trunk：`trunk build`（默认 dev）不跑 wasm-opt，迭代快；`trunk build --release` 使用默认 wasm-opt。
      workspace 根 Cargo.toml 对 crabmate-web 设 opt-level="z"；release 默认无 LTO（`release-lto` profile 可选）。
      当前 release WASM：~9.7MB（raw）→ wasm-opt → ~3.4MB（gzip 后约 1.5MB）。
      wasm-opt 须在 PATH 中（`cargo install wasm-opt`），否则 trunk build --release 产出空文件。
      若要跳过 wasm-opt 可加 `data-wasm-opt="0"`（见 Trunk 文档）。
    -->
    <link data-trunk rel="rust" />
  </body>
</html>
