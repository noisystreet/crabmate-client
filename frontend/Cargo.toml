[package]
name = "crabmate-web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CrabMate Web UI (Leptos CSR + WASM)"
# 契约钉版本：crates.io crabmate 0.5.0 + protocol（见 docs/design/contract_pin.md）

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Server 线契约（禁止 path 回本地 crabmate_agent；勿开 server feature）
crabmate = { version = "0.5.0", default-features = false, features = ["protocol"] }
# 本仓 path（展示 crate / 共享逻辑；勿 path 回 Server）
crabmate-tool-card = { path = "../crates/crabmate-tool-card" }
crabmate-client-api = { path = "../crates/crabmate-client-api" }
ammonia = ">=4.1.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.17", features = ["csr"] }
leptos_dom = "0.8.8"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "console",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DomTokenList",
    "DragEvent",
    "Element",
    "Event",
    "FormData",
    "File",
    "FileList",
    "HashChangeEvent",
    "Headers",
    "History",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Location",
    "ResizeObserver",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlImageElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlScriptElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Performance",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Selection",
    "Storage",
    "Url",
    "VisualViewport",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
