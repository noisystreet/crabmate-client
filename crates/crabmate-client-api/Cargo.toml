[package]
name = "crabmate-client-api"
version = "0.5.1-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "Pure shared client logic for CrabMate (URL / auth / secrets / approval / workspace / sessions / chat body / hash handoff / health JSON; no IO)"
repository = "https://github.com/noisystreet/crabmate-client"
publish = false

# 独立单包 workspace：与 connect / tui-core 一致，避免根 workspace 吞掉 path 依赖解析。
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 契约镜像单一来源（镜像瘦身：agent_space/client_api_mirror_thinning.md）；protocol feature 零依赖
crabmate = { version = "0.5.2", default-features = false, features = ["protocol"] }

[dev-dependencies]
