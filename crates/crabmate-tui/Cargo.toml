[package]
name = "crabmate-tui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CrabMate remote terminal client (HTTP/SSE to crabmate serve)"
repository = "https://github.com/noisystreet/crabmate-client"
publish = false
default-run = "crabmate-tui"

[[bin]]
name = "crabmate-tui"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crabmate-client-api = { path = "../crabmate-client-api" }
crabmate-tui-core = { path = "../crabmate-tui-core" }
crossterm = "0.28"
keyring = "4.1.5"
ratatui = "0.29"
reedline = { version = "0.49", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-width = "0.2"
