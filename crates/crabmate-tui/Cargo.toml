[package]
name = "crabmate-tui"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "CrabMate remote terminal client (HTTP/SSE to crabmate serve)"
repository = "https://github.com/noisystreet/crabmate-client"
publish = false
default-run = "crabmate-tui"

[[bin]]
name = "crabmate-tui"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "1"
# 背景图走 kitty 协议要以 base64 传输；用锁文件里已有的 0.22，不再多拉一份。
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
crabmate = { version = "0.7.0", default-features = false, features = ["protocol"] }
crabmate-client-api = { path = "../crabmate-client-api" }
# `role=tool` 落盘正文是 `{"crabmate_tool":{…}}` 信封；解包规则与 Web 水合共用一份。
crabmate-tool-card = { path = "../crabmate-tool-card" }
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `/background` 的解码 / 缩放 / 压暗 / 重编码；只开带得上的格式，不把全部编解码器编进来。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = "4.1.5"
ratatui = "0.30"
reedline = { version = "0.52", default-features = false }
# 0.13 移除 rustls-tls；"rustls" = aws-lc-rs + 平台证书验证器（与 connect 保持一致）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"
