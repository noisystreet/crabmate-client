[package]
name = "crabmate-tui"
version = "0.5.1-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "CrabMate remote terminal client (HTTP/SSE to crabmate serve)"
repository = "https://github.com/noisystreet/crabmate-client"
publish = false
default-run = "crabmate-tui"

[[bin]]
name = "crabmate-tui"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crabmate = { version = "0.5.2", default-features = false, features = ["protocol"] }
crabmate-client-api = { path = "../crabmate-client-api" }
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = "4.1.5"
ratatui = "0.30"
reedline = { version = "0.49", default-features = false }
# 0.13 移除 rustls-tls；"rustls" = aws-lc-rs + 平台证书验证器（与 connect 保持一致）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"
