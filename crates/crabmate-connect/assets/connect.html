<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>CrabMate</title>
    <style>
      :root {
        --bg0: #0a0d12;
        --bg1: #121820;
        --fg: #e8ecf1;
        --muted: #909dad;
        --accent: #7b90c4;
        --field: #1a222d;
        --border: #2a3340;
        --danger: #c98c9b;
        --radius-btn: 5px;
        --font: "DM Sans", "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        /* 桌面小窗用 100%；移动 WebView 保留 100dvh，避免地址栏伸缩撑不满。 */
        min-height: 100%;
        min-height: 100dvh;
        height: 100%;
        font-family: var(--font);
        background: radial-gradient(120% 80% at 50% 0%, #1a222d 0%, var(--bg0) 55%);
        color: var(--fg);
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.9rem 1.15rem
          calc(0.9rem + max(var(--cm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px)));
        padding-top: calc(0.9rem + var(--cm-safe-top, env(safe-area-inset-top, 0px)));
      }
      .shell {
        width: min(100%, 26rem);
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 0.7rem;
      }
      .mark {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(145deg, #232c38, #121820);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        margin-bottom: 0.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .mark span {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.22rem;
      }
      input {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: var(--radius-btn);
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--fg);
        font-size: 0.92rem;
        font-family: inherit;
        margin-bottom: 0.5rem;
      }
      input:focus {
        outline: 2px solid rgba(123, 144, 196, 0.4);
        outline-offset: 1px;
      }
      button {
        width: 100%;
        padding: 0.65rem 1rem;
        border: 1px solid rgba(78, 93, 123, 1);
        border-radius: var(--radius-btn);
        background: rgb(47, 58, 78);
        color: var(--fg);
        font-size: 0.92rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:active:not(:disabled) {
        filter: brightness(0.94);
      }
      .recent {
        margin-top: 0.9rem;
        border-top: 1px solid var(--border);
        padding-top: 0.7rem;
      }
      .recent[hidden] { display: none; }
      .recent-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.4rem;
      }
      .recent-title {
        font-size: 0.76rem;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .recent-clear {
        width: auto;
        padding: 0.15rem 0.5rem;
        font-size: 0.72rem;
        font-weight: 500;
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        border-radius: 4px;
      }
      .recent-clear:hover { color: var(--fg); }
      .recent-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .recent-item {
        width: 100%;
        text-align: left;
        padding: 0.5rem 0.7rem;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--fg);
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: var(--radius-btn);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recent-item:hover {
        border-color: rgba(123, 144, 196, 0.5);
      }
      .err {
        color: #e8c4cc;
        font-size: 0.82rem;
        margin: 0 0 0.35rem;
        white-space: pre-wrap;
      }
      .err:empty { display: none; }
      .status {
        color: var(--muted);
        font-size: 0.82rem;
        margin: 0 0 0.25rem;
        text-align: center;
      }
      .status:empty { display: none; }
      html[data-cm-mobile-shell] body {
        justify-content: flex-start;
        padding-top: calc(1rem + var(--cm-safe-top, 0px));
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="brand">
        <div class="mark" aria-hidden="true"><span>C</span></div>
        <h1>CrabMate</h1>
      </div>
      <form id="connect-form" method="post" action="#" autocomplete="on">
        <label for="url">服务器地址</label>
        <input
          id="url"
          name="username"
          type="url"
          inputmode="url"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="http://127.0.0.1:8080/"
          required
        />
        <label for="bearer">Web API 共享密钥</label>
        <input
          id="bearer"
          name="password"
          type="password"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        />
        <p class="status" id="status" aria-live="polite"></p>
        <p class="err" id="err" aria-live="assertive"></p>
        <button type="submit" id="submit">连接</button>
      </form>
      <section class="recent" id="recent" hidden>
        <div class="recent-head">
          <span class="recent-title">最近连接</span>
          <button type="button" class="recent-clear" id="recent-clear">清空</button>
        </div>
        <ul class="recent-list" id="recent-list"></ul>
      </section>
    </div>
    <script>
      const URL_KEY = "crabmate.connect.serverUrl";
      const BEARER_KEY_LEGACY_MOBILE = "crabmate.mobile.webApiBearer";
      const URL_KEY_LEGACY_MOBILE = "crabmate.mobile.serverUrl";
      const RECENT_KEY = "crabmate.connect.recentUrls";
      const MAX_RECENT = 8;
      const form = document.getElementById("connect-form");
      const urlInput = document.getElementById("url");
      const bearerInput = document.getElementById("bearer");
      const err = document.getElementById("err");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      /** 防止自动登录与手动提交并发探测 */
      let connectInFlight = false;
      /** 壳预填的建议服务器 URL（桌面多为本机 8080）；无则留空 */
      let suggestedServerUrl = "";

      function wantsManualConnect() {
        try {
          return new URLSearchParams(location.search).get("manual") === "1";
        } catch (_) {
          return false;
        }
      }

      function isLoopbackHost(host) {
        const h = (host || "").toLowerCase();
        return (
          h === "127.0.0.1" ||
          h === "localhost" ||
          h === "::1" ||
          h === "[::1]"
        );
      }

      function isLoopbackUrl(href) {
        try {
          return isLoopbackHost(new URL(href).hostname);
        } catch (_) {
          return false;
        }
      }

      function tauriCore() {
        return window.__TAURI__ && window.__TAURI__.core;
      }

      function invoke(cmd, args) {
        const core = tauriCore();
        if (!core || typeof core.invoke !== "function") {
          return Promise.reject("Tauri IPC 不可用");
        }
        return core.invoke(cmd, args || {});
      }

      (function applySafeInsets() {
        function run() {
          try {
            const b = window.CrabMateMobile;
            if (!b || typeof b.getStatusBarInsetPx !== "function") return false;
            let top = Number(b.getStatusBarInsetPx());
            if (!Number.isFinite(top) || top < 0) top = 24;
            top = Math.max(top, 24);
            let bottom = 24;
            if (typeof b.getNavBarInsetPx === "function") {
              bottom = Number(b.getNavBarInsetPx());
              if (!Number.isFinite(bottom) || bottom < 0) bottom = 24;
              bottom = Math.max(bottom, 24);
            }
            const root = document.documentElement;
            root.style.setProperty("--cm-safe-top", top + "px");
            root.style.setProperty("--cm-safe-bottom", bottom + "px");
            root.setAttribute("data-cm-mobile-shell", "");
            return true;
          } catch (_) {
            return false;
          }
        }
        if (!run()) {
          [50, 200, 600].forEach(function (ms) {
            setTimeout(run, ms);
          });
        }
      })();

      function readLegacyUrl() {
        try {
          return (
            localStorage.getItem(URL_KEY) ||
            localStorage.getItem(URL_KEY_LEGACY_MOBILE) ||
            ""
          );
        } catch (_) {
          return "";
        }
      }

      function normalizeRecentUrl(raw) {
        let s = (raw || "").trim();
        if (!s) return "";
        if (!/^https?:\/\//i.test(s)) s = "http://" + s;
        try {
          const u = new URL(s);
          if (u.protocol !== "http:" && u.protocol !== "https:") return "";
          return u.href;
        } catch (_) {
          return "";
        }
      }

      function readRecentUrls() {
        try {
          const raw = localStorage.getItem(RECENT_KEY);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return [];
          const out = [];
          for (const item of arr) {
            const href = normalizeRecentUrl(item);
            if (href && out.indexOf(href) === -1) out.push(href);
            if (out.length >= MAX_RECENT) break;
          }
          return out;
        } catch (_) {
          return [];
        }
      }

      function writeRecentUrls(list) {
        try {
          localStorage.setItem(
            RECENT_KEY,
            JSON.stringify((list || []).slice(0, MAX_RECENT))
          );
        } catch (_) {}
      }

      /** 是否已初始化过历史（区分“从未写入”与“清空后为空”）。 */
      function hasRecentHistory() {
        try {
          return localStorage.getItem(RECENT_KEY) !== null;
        } catch (_) {
          return false;
        }
      }

      function rememberRecentUrl(href) {
        const norm = normalizeRecentUrl(href);
        if (!norm) return;
        const list = readRecentUrls().filter((h) => h !== norm);
        list.unshift(norm);
        writeRecentUrls(list);
        renderRecent();
      }

      function renderRecent() {
        const section = document.getElementById("recent");
        const listEl = document.getElementById("recent-list");
        if (!section || !listEl) return;
        const list = readRecentUrls();
        if (!list.length) {
          section.hidden = true;
          listEl.innerHTML = "";
          return;
        }
        section.hidden = false;
        listEl.innerHTML = "";
        list.forEach((href) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "recent-item";
          btn.textContent = href;
          btn.title = href;
          btn.addEventListener("click", function () {
            urlInput.value = href;
            bearerInput.focus();
          });
          li.appendChild(btn);
          listEl.appendChild(li);
        });
      }

      function clearPlaintextBearerStorage() {
        try {
          localStorage.removeItem(BEARER_KEY_LEGACY_MOBILE);
        } catch (_) {}
      }

      /**
       * Android：优先 Keystore AES-GCM 桥（SecureBearerStore）；若仅有旧版明文 localStorage 则一次性迁入后清除。
       * 桌面：无桥时返回空（预填靠系统钥匙串 invoke）。
       */
      function readLegacyBearer() {
        try {
          const bridge = mobileBridge();
          if (bridge && typeof bridge.getSecureBearer === "function") {
            const secure = (bridge.getSecureBearer() || "").trim();
            if (secure) {
              clearPlaintextBearerStorage();
              return secure;
            }
          }
        } catch (_) {}
        let plaintext = "";
        try {
          plaintext = (localStorage.getItem(BEARER_KEY_LEGACY_MOBILE) || "").trim();
        } catch (_) {
          plaintext = "";
        }
        if (!plaintext) {
          return "";
        }
        try {
          const bridge = mobileBridge();
          if (
            bridge &&
            typeof bridge.setSecureBearer === "function" &&
            bridge.setSecureBearer(plaintext)
          ) {
            clearPlaintextBearerStorage();
          }
        } catch (_) {}
        return plaintext;
      }

      async function hydrateFields() {
        let suggested = "";
        try {
          suggested = (await invoke("get_suggested_server_url")) || "";
        } catch (_) {}
        suggestedServerUrl = (suggested || "").trim();

        const savedUrl = readLegacyUrl();
        // 有建议地址且已存为回环（或尚无已存）时用建议值，避免旧端口残留。
        if (suggestedServerUrl && (!savedUrl || isLoopbackUrl(savedUrl))) {
          urlInput.value = suggestedServerUrl;
        } else if (savedUrl) {
          urlInput.value = savedUrl;
        } else if (suggestedServerUrl) {
          urlInput.value = suggestedServerUrl;
        }

        await mergeRecentFromShell();

        // 首次升级：仅在尚未初始化历史时，把既存的“上次地址”纳入最近连接。
        if (savedUrl && !hasRecentHistory()) {
          rememberRecentUrl(savedUrl);
        }

        let keyringBearer = "";
        try {
          keyringBearer = (await invoke("get_connect_bearer")) || "";
        } catch (_) {}
        if (keyringBearer) {
          bearerInput.value = keyringBearer;
        } else {
          const legacy = readLegacyBearer();
          if (legacy) bearerInput.value = legacy;
        }
        renderRecent();
      }

      function setBusy(busy, msg) {
        submitBtn.disabled = !!busy;
        statusEl.textContent = msg || "";
      }

      function mobileBridge() {
        return window.CrabMateMobile || null;
      }

      function notifyAutofillSuccess() {
        try {
          const b = mobileBridge();
          if (b && typeof b.notifyLoginSuccess === "function") {
            b.notifyLoginSuccess();
          }
        } catch (_) {}
      }

      function notifyAutofillFailure() {
        try {
          const b = mobileBridge();
          if (b && typeof b.notifyLoginFailure === "function") {
            b.notifyLoginFailure();
          }
        } catch (_) {}
      }

      function invokeConnect(url, bearer) {
        const core = tauriCore();
        if (!core || typeof core.invoke !== "function") {
          return Promise.reject(
            "Tauri IPC 不可用：请在桌面/移动壳内连接（勿在普通浏览器直接打开连接页）"
          );
        }
        return core.invoke("connect_remote", { url, bearer: bearer || "" });
      }

      function isSuggestedUrl(href) {
        const n = normalizeRecentUrl(href);
        const s = normalizeRecentUrl(suggestedServerUrl);
        return !!(n && s && n === s);
      }

      function readStorageItem(key) {
        try {
          return localStorage.getItem(key);
        } catch (_) {
          return null;
        }
      }

      function writeStorageItem(key, value) {
        try {
          if (value === null) localStorage.removeItem(key);
          else localStorage.setItem(key, value);
        } catch (_) {}
      }

      function snapshotConnectPersist() {
        return {
          url: readStorageItem(URL_KEY),
          legacy: readStorageItem(URL_KEY_LEGACY_MOBILE),
          recent: readStorageItem(RECENT_KEY),
        };
      }

      function restoreConnectPersist(snap) {
        writeStorageItem(URL_KEY, snap.url);
        writeStorageItem(URL_KEY_LEGACY_MOBILE, snap.legacy);
        writeStorageItem(RECENT_KEY, snap.recent);
        renderRecent();
      }

      function persistLastServerUrl(href) {
        try {
          // 上次地址（自动登录）：有桌面建议时任意回环都不落盘，避免连到已退出的本机端口。
          // 最近列表只跳过「与建议 URL 完全相同」的那条，其它回环端口仍可出现在历史上。
          if (suggestedServerUrl && isLoopbackUrl(href)) {
            return;
          }
          localStorage.setItem(URL_KEY, href);
          localStorage.setItem(URL_KEY_LEGACY_MOBILE, href);
        } catch (_) {}
      }

      async function mergeRecentFromShell() {
        try {
          const remote = await invoke("get_recent_connect_urls");
          if (!Array.isArray(remote)) return;
          const merged = [];
          const add = function (raw) {
            const href = normalizeRecentUrl(raw);
            if (!href || merged.indexOf(href) !== -1) return;
            if (merged.length >= MAX_RECENT) return;
            merged.push(href);
          };
          remote.forEach(add);
          readRecentUrls().forEach(add);
          if (merged.length || remote.length || hasRecentHistory()) {
            writeRecentUrls(merged);
          }
        } catch (_) {}
      }

      function persistBearerFallback(bearer) {
        // Android：无系统钥匙串时写入 Keystore AES-GCM（CrabMateMobile）；不再落明文 localStorage。
        // 桌面：connect_remote 已写/清钥匙串；此处不写 Bearer。
        // 空串：显式清除已存密钥（与 connect_remote 空串删槽一致）。
        const b = (bearer || "").trim();
        try {
          const bridge = mobileBridge();
          if (
            bridge &&
            typeof bridge.setSecureBearer === "function" &&
            bridge.setSecureBearer(b)
          ) {
            if (b) {
              clearPlaintextBearerStorage();
            }
          }
        } catch (_) {}
      }

      async function connectWithValues(rawUrl, bearer, opts) {
        if (connectInFlight) {
          return false;
        }
        const fromAuto = !!(opts && opts.fromAuto);
        err.textContent = "";
        let raw = (rawUrl || "").trim();
        if (!raw) {
          err.textContent = "请填写服务器地址";
          return false;
        }
        if (!/^https?:\/\//i.test(raw)) {
          raw = "http://" + raw;
        }
        let u;
        try {
          u = new URL(raw);
        } catch (_) {
          err.textContent = "地址无效";
          return false;
        }
        if (u.protocol !== "http:" && u.protocol !== "https:") {
          err.textContent = "仅支持 http/https";
          return false;
        }
        connectInFlight = true;
        setBusy(true, fromAuto ? "已记住连接，正在自动登录…" : "正在探测服务器…");
        const persistSnap = snapshotConnectPersist();
        try {
          // 卸页前先写；失败则还原，避免把没连上的地址当成下次自动登录目标。
          if (!isSuggestedUrl(u.href)) {
            rememberRecentUrl(u.href);
          }
          persistLastServerUrl(u.href);
          await invokeConnect(u.href, bearer);
          persistBearerFallback(bearer);
          if (!fromAuto) {
            notifyAutofillSuccess();
          }
          setBusy(true, "已连接，正在打开界面…");
          return true;
        } catch (ex) {
          restoreConnectPersist(persistSnap);
          connectInFlight = false;
          if (!fromAuto) {
            notifyAutofillFailure();
          }
          const msg =
            typeof ex === "string"
              ? ex
              : ex && ex.message
                ? ex.message
                : String(ex);
          err.textContent = fromAuto
            ? "自动登录失败：" + msg + "\n请核对地址与共享密钥后重试。"
            : msg;
          setBusy(false, "");
          return false;
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        await connectWithValues(urlInput.value, bearerInput.value, {
          fromAuto: false,
        });
      });

      document.getElementById("recent-clear").addEventListener("click", async function () {
        const prev = snapshotConnectPersist();
        // 写空数组（而非删除键），避免下次加载又触发“首次升级”种子。
        writeRecentUrls([]);
        renderRecent();
        try {
          await invoke("clear_recent_connect_urls");
        } catch (_) {
          restoreConnectPersist(prev);
          err.textContent = "无法清空最近连接，请重试";
        }
      });

      (async function boot() {
        await hydrateFields();
        if (wantsManualConnect()) {
          return;
        }
        const saved = readLegacyUrl();
        let target = "";
        let shouldAuto = false;
        if (suggestedServerUrl) {
          // 桌面：优先建议/输入框；已存远程地址则沿用。
          target = urlInput.value || suggestedServerUrl;
          shouldAuto = !!target;
        } else if (saved) {
          target = saved;
          shouldAuto = true;
        }
        if (!shouldAuto || !target) {
          return;
        }
        const bearer = bearerInput.value || "";
        setTimeout(function () {
          connectWithValues(target, bearer, { fromAuto: true });
        }, 80);
      })();
    </script>
  </body>
</html>
