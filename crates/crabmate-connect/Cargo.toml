[package]
name = "crabmate-connect"
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
description = "Shared connect-page helpers for CrabMate shells (probe /health+/prefs, Bearer handoff, keyring)"
repository = "https://github.com/noisystreet/CrabMate"
readme = "README.md"
# 默认经 git tag + path 钉版本（见 docs/design/client_contract_versioning.md）；勿加入主 workspace members。
publish = false

# 独立单包 workspace：根 workspace 含 members=["."] 时，仅 exclude 不足以用
# `--manifest-path` 解析本包；须自带空 [workspace]（见 Cargo 提示）。
# 根 Cargo.toml 亦 exclude = ["crates/crabmate-connect"]。
[workspace]

[dependencies]
crabmate-client-api = { path = "../crabmate-client-api" }
keyring = "4.1.5"
# 0.13 与 Tauri 2.11 内置 reqwest 同大版本，避免双 HTTP 栈（hyper/rustls 两套）。
# 0.13 移除 rustls-tls；"rustls" = aws-lc-rs 提供者 + 平台证书验证器（默认 TLS 后端）。
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
# Desktop / Android 壳启用：Tauri commands + WebView 导航钩子（会拉 GTK/WebKit）。
tauri = ["dep:tauri"]
