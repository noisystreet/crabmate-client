[package]
name = "crabmate-tui-core"
version = "0.5.1-alpha.0"
edition = "2024"
license = "Apache-2.0"
description = "HTTP/SSE client core for CrabMate remote terminal (crabmate-tui)"
repository = "https://github.com/noisystreet/crabmate-client"
publish = false

[workspace]

[dependencies]
crabmate-client-api = { path = "../crabmate-client-api" }
crabmate = { version = "0.5.2", default-features = false, features = ["protocol"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# 0.13 移除 rustls-tls；"rustls" = aws-lc-rs + 平台证书验证器（与 connect 保持一致）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
