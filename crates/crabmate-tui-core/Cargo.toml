[package]
name = "crabmate-tui-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "HTTP/SSE client core for CrabMate remote terminal (crabmate-tui)"
repository = "https://github.com/noisystreet/crabmate-client"
publish = false

[workspace]

[dependencies]
crabmate-client-api = { path = "../crabmate-client-api" }
crabmate-sse-protocol = { git = "https://github.com/noisystreet/CrabMate", tag = "v0.3.0", package = "crabmate-sse-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
