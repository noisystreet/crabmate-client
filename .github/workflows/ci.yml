# crabmate-client：壳 + connect + frontend 门禁（不含 Victauri 全量 E2E）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (fmt · clippy · complexity · no-main-path · frontend · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Install system deps (OpenSSL / libssh2 / libgtk-3 / libwebkit2gtk / libappindicator)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libssl-dev libssh2-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            ripgrep

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            mobile-tauri/src-tauri
            crates/crabmate-connect
            crates/crabmate-tui-core
            crates/crabmate-tui
            frontend

      - name: Install lizard (complexity via check.sh)
        run: pip install lizard

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Forbid path deps back to Server monorepo
        run: bash scripts/check-no-main-path.sh

      - name: scripts/check.sh (fmt + clippy + frontend wasm + complexity + ktlint)
        run: bash scripts/check.sh

      - name: Install trunk (frontend smoke)
        run: cargo install trunk --locked

      - name: trunk build (frontend)
        run: make frontend

      - name: cargo test (connect)
        run: cargo test
        working-directory: crates/crabmate-connect

      - name: cargo test (desktop; Victauri auto-skip)
        run: cargo test --no-fail-fast
        working-directory: desktop-tauri/src-tauri

      - name: cargo check (mobile)
        run: cargo check --tests
        working-directory: mobile-tauri/src-tauri

  build-android-apk:
    name: android package (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-tauri/src-tauri

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Seed packaged UI stub
        run: |
          mkdir -p frontend/dist
          printf '<!DOCTYPE html><html><body>ci-mobile-stub</body></html>\n' > frontend/dist/index.html

      - name: Build Android APK
        env:
          CM_MOBILE_SKIP_FRONTEND: "1"
          MOBILE_ANDROID_TARGET: aarch64
        run: make apk

      - name: Verify Android APK
        run: test -s mobile-tauri/crabmate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crabmate-android-aarch64
          path: mobile-tauri/crabmate.apk
          retention-days: 7

  build-desktop-deb:
    name: desktop release package (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Install system deps (GTK / WebKit / bundler)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libssl-dev libssh2-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            crates/crabmate-connect

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # 打包门禁不跑 trunk：显式跳过 UI 同步，仅用壳 stub
      - name: cargo tauri build (deb via Makefile)
        env:
          CM_PREPARE_SKIP_FRONTEND: "1"
        run: |
          mkdir -p desktop-tauri/dist
          echo '<!DOCTYPE html><html><body>ci-stub</body></html>' > desktop-tauri/dist/index.html
          make desktop-release

      - name: Verify deb package
        run: |
          set -euo pipefail
          DEB=$(ls desktop-tauri/src-tauri/target/release/bundle/deb/crabmate-desktop_*.deb | head -1)
          test -f "$DEB"
          ls -lh "$DEB"
          # Debian Package 名须与 Server 主仓 crabmate.deb 区分
          dpkg-deb -I "$DEB" | grep -E '^ Package: crabmate-desktop$'
          dpkg-deb -c "$DEB" | grep -E 'usr/bin/crabmate-desktop$'
          dpkg-deb -c "$DEB" | grep -E 'usr/share/applications/crabmate-desktop\.desktop$'
          # /etc/crabmate 归 Server 包；桌面壳不得占用
          if dpkg-deb -c "$DEB" | grep -E 'etc/crabmate/'; then
            echo "error: desktop deb must not ship /etc/crabmate (owned by server package)" >&2
            exit 1
          fi
          # 不得再打进 serve sidecar
          if dpkg-deb -c "$DEB" | grep -E 'usr/bin/crabmate$'; then
            echo "error: deb must not contain crabmate serve sidecar" >&2
            exit 1
          fi
          echo "deb package OK: $DEB"
