# Playwright E2E（Client 仓 · 官方 UI）
#
# mock SSE 基线（不依赖 LLM）。真实 LLM 仅本地：
#   cd e2e && npx playwright test specs/real-llm-*.spec.ts
#
# CI：本仓 make frontend + checkout Server 编纯 API serve + 本仓编 crabmate-web
#（回环托管 UI；serve 不传 --with-web，CORS 放行 web Origin）。

name: E2E Playwright

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "e2e/**"
      - "scripts/e2e-playwright.sh"
      - ".github/workflows/e2e-playwright.yml"

concurrency:
  group: e2e-pw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout CrabMate (serve)
        uses: actions/checkout@v4
        with:
          repository: noisystreet/CrabMate
          # 与契约钉点一致：crates.io crabmate 0.5.0（git tag v0.5.0）
          ref: v0.5.0
          path: crabmate-server

      - name: Install system deps (OpenSSL / libssh2)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend
            crabmate-server
            crates/crabmate-web-host

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build frontend WASM
        run: |
          unset NO_COLOR
          make frontend

      - name: Build backend (serve)
        run: cargo build -p crabmate --features web
        working-directory: crabmate-server

      - name: Build crabmate-web
        run: cargo build --bin crabmate-web
        working-directory: crates/crabmate-web-host

      - name: Start API server and crabmate-web
        env:
          CM_WEB_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
        run: |
          # Server 默认纯 API；SPA 由客户端 crabmate-web 回环托管（与 scripts/e2e-playwright.sh 一致）
          ./crabmate-server/target/debug/crabmate serve &
          ./crates/crabmate-web-host/target/debug/crabmate-web \
            --listen 127.0.0.1:4173 \
            --root "${GITHUB_WORKSPACE}/frontend/dist" \
            --api-base http://127.0.0.1:8080 \
            --no-open &
          sleep 2
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "✅ API 就绪 (尝试 $i)"
              break
            fi
            echo "⏳ 等待 API... (尝试 $i)"
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/ > /dev/null 2>&1; then
              echo "✅ crabmate-web 就绪 (尝试 $i)"
              break
            fi
            echo "⏳ 等待 crabmate-web... (尝试 $i)"
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install chromium
        working-directory: e2e

      - name: Run mock SSE tests (layout baseline + overlay)
        run: |
          npx playwright test \
            specs/mock-overlay-timing.spec.ts \
            specs/mock-mid-process-commentary-duplicate.spec.ts \
            specs/mock-commentary-before-tool-order.spec.ts \
            specs/mock-empty-assistant-shell.spec.ts \
            specs/mock-real-tool-bubble-vanish.spec.ts \
            specs/mock-tool-call-scenarios.spec.ts \
            specs/mock-approval-scenarios.spec.ts \
            specs/mock-multi-turn.spec.ts \
            specs/mock-storage-consistency.spec.ts \
            specs/mock-v2-multi-turn-boundaries.spec.ts \
            specs/mock-mobile-shell.spec.ts \
            specs/mock-hydrate-parse-failed.spec.ts \
            --reporter=list
        working-directory: e2e
        env:
          no_proxy: 127.0.0.1,localhost
          CRABMATE_API_BASE: http://127.0.0.1:8080
          CRABMATE_WEB_PORT: "4173"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: pkill -f "crabmate" || true