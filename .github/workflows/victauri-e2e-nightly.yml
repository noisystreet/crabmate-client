# Victauri Desktop 壳 E2E（需 WebView + 外部 serve；不进 PR 默认 CI）
#
# mock 基线：不含 real_llm（需 REAL_LLM_E2E + 本机密钥）。
# 手动：Actions → Victauri E2E Nightly → Run workflow

name: Victauri E2E Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: victauri-e2e-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  victauri-e2e:
    name: Victauri shell E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout CrabMate (serve)
        uses: actions/checkout@v4
        with:
          repository: noisystreet/CrabMate
          ref: v0.5.1
          path: crabmate-server

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Install system deps (GTK / WebKit / xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libssl-dev libssh2-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xvfb ripgrep

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            frontend
            crabmate-server

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build frontend WASM
        run: |
          unset NO_COLOR
          make frontend

      - name: Build backend (serve)
        run: cargo build -p crabmate --features web
        working-directory: crabmate-server

      - name: Run Victauri E2E (all mock suites)
        env:
          CM_DESKTOP_BACKEND_BIN: ${{ github.workspace }}/crabmate-server/target/debug/crabmate
          VICTAURI_E2E_LOG: /tmp/crabmate-desktop-e2e.log
          VICTAURI_SERVE_LOG: /tmp/crabmate-serve-e2e.log
          VICTAURI_USE_XVFB: "1"
        run: ./scripts/victauri-e2e.sh all

      - name: Upload Victauri logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: victauri-e2e-logs
          path: |
            /tmp/crabmate-desktop-e2e.log
            /tmp/crabmate-serve-e2e.log
          retention-days: 7
          if-no-files-found: ignore
