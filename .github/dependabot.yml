version: 2
updates:
  # --- Rust（一条多目录条目；本仓无顶层 workspace，包各自独立 Cargo.lock）---
  # tokio / serde_json 用 group-by: dependency-name 做「跨目录同名依赖合并」——
  # 同一次升级只出一条 PR（覆盖所有含该依赖的包），其余依赖仍按目录各自出 PR。
  # tauri 生态保持「一族一起升」的既有分组。
  - package-ecosystem: cargo
    directories:
      - /desktop-tauri/src-tauri
      - /mobile-tauri/src-tauri
      - /crates/crabmate-client-api
      - /crates/crabmate-connect
      - /crates/crabmate-tool-card
      - /crates/crabmate-tui
      - /web-host
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # tokio 跨全部目录收敛为一条 PR（本仓曾一次开出 4 条同名 patch PR）。
      tokio:
        patterns:
          - "tokio"
        group-by: dependency-name
      # serde_json 跨全部目录收敛为一条 PR（曾一次开出 8 条同名 patch PR）。
      serde-json:
        patterns:
          - "serde_json"
        group-by: dependency-name
      # Tauri 生态须版本对齐（tauri / tauri-build / tauri-plugin-* / victauri*），
      # 一条 PR 升一组，避免单包 PR 互相拆散与 lockstep 手工对齐。
      tauri-ecosystem:
        patterns:
          - "tauri*"
          - "victauri*"
    labels:
      - dependencies
      - rust

  # --- npm ---
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # e2e 工具链（playwright / typescript / prettier / @types/*）非发布依赖，
    # 合成一条 PR，减少独立 CI 触发。
    groups:
      e2e-tooling:
        patterns:
          - "*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # CodeMirror 生态包须版本对齐，一条 PR 升一组。
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "codemirror"
          - "@lezer/*"
    labels:
      - dependencies
      - npm

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
