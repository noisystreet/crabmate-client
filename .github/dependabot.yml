version: 2
updates:
  # --- Rust（每个独立 workspace 一条；本仓无顶层 workspace，包各自独立）---
  - package-ecosystem: cargo
    directory: /desktop-tauri/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

