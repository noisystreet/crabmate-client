version: 2
updates:
  # --- Rust（每个独立 workspace 一条；本仓无顶层 workspace，包各自独立）---
  - package-ecosystem: cargo
    directory: /desktop-tauri/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # Tauri 生态须版本对齐（tauri / tauri-build / tauri-plugin-* / victauri*），
    # 一条 PR 升一组，避免单包 PR 互相拆散与 lockstep 手工对齐。
    groups:
      tauri-ecosystem:
        patterns:
          - "tauri*"
          - "victauri*"
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /mobile-tauri/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      tauri-ecosystem:
        patterns:
          - "tauri*"
          - "victauri*"
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /crates/crabmate-client-api
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /crates/crabmate-connect
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /crates/crabmate-tool-card
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /crates/crabmate-tui
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /web-host
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  # --- npm ---
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # e2e 工具链（playwright / typescript / prettier / @types/*）非发布依赖，
    # 合成一条 PR，减少独立 CI 触发。
    groups:
      e2e-tooling:
        patterns:
          - "*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # CodeMirror 生态包须版本对齐，一条 PR 升一组。
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "codemirror"
          - "@lezer/*"
    labels:
      - dependencies
      - npm

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
