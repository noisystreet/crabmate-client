[package]
name = "crabmate-desktop"
version = "0.8.0-alpha.3"
description = "CrabMate desktop shell powered by Tauri"
authors = ["crabmate contributors"]
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
victauri-plugin = { version = "0.10", optional = true }
tokio = { version = "1", features = ["sync"] }
url = "2"
serde_json = "1"
crabmate-connect = { path = "../../crates/crabmate-connect", features = ["tauri"] }
# 多窗口连接注册表直接用共享快照类型（`ConnectionSnapshot` / `ConnectionStatus`），
# 避免在 Desktop 侧再定义一个只在显示层长得一样的结构。
crabmate-client-api = { path = "../../crates/crabmate-client-api" }
base64 = "0.23"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
# 被覆盖的窗口看不到自己的审批弹窗（窗口铺满工作区，后开的完全盖住前一个），
# 系统通知是它在等审批时唯一的出路 —— 与 Android 的 ADR-0002 同一动机。
tauri-plugin-notification = "2"

[dev-dependencies]
victauri-test = "0.10"
victauri-plugin = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
victauri = ["dep:victauri-plugin"]

[workspace]
